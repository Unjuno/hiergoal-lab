name: Method validation study
run-name: Method study ${{ inputs.mode || 'prepare' }} · ${{ inputs.profile || 'pilot' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'prepare: offline checks only / run: explicitly execute the selected API study'
        type: choice
        options: [prepare, run]
        default: prepare
        required: true
      profile:
        description: 'pilot 18 / study 216 / mechanism 108 / scale 252 / reliability 720 trials'
        type: choice
        options: [pilot, study, mechanism, scale, reliability]
        default: pilot
        required: true
  push:
    branches: [main]
    paths:
      - 'hiergoal/study*.py'
      - 'tests/test_study*.py'
      - 'docs/method_study_ja.md'
      - 'docs/method_requirements_audit_ja.md'
      - '.github/workflows/method-study.yml'

permissions:
  contents: read

concurrency:
  group: hiergoal-live-experiment
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      STUDY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'prepare' }}
      STUDY_PROFILE: ${{ inputs.profile || 'pilot' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check explicit live launch prerequisites (no inference)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'run' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Run the live study on main.'; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo 'Configure repository Actions secret OPENAI_API_KEY.'; exit 1; }
      - name: Offline regression tests (no credential)
        run: python3 -m unittest discover -s tests -v
      - name: Exercise selected profile offline (no credential)
        run: python3 -m hiergoal.study check --profile "$STUDY_PROFILE" --output runs/method-check
      - name: Freeze manifest before any model request
        run: python3 -m hiergoal.study prepare --profile "$STUDY_PROFILE" --output runs/method-study
      - name: Execute only the explicitly selected live study
        id: live
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'run' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.openai.com/v1
        run: python3 -m hiergoal.study run --output runs/method-study --execute --approve-paid-api
      - name: Recheck all retained evidence including incomplete runs
        id: collect
        if: ${{ always() }}
        run: |
          if test -f runs/method-study/manifest.json; then
            python3 -m hiergoal.study collect --output runs/method-study
            cat runs/method-study/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload protocol, traces, artifacts and analysis
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: method-study-${{ env.STUDY_MODE }}-${{ env.STUDY_PROFILE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/method-study/
            runs/method-check/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
      - name: Export public structured results and receipt (no credential)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'run' && github.ref == 'refs/heads/main' }}
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome || 'skipped' }}
          COLLECTION_OUTCOME: ${{ steps.collect.outcome || 'skipped' }}
        run: |
          python3 -m hiergoal.study_archive export \
            --source runs/method-study --destination "$RUNNER_TEMP/hiergoal-public" \
            --profile "$STUDY_PROFILE" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA" \
            --live-outcome "$LIVE_OUTCOME" --collection-outcome "$COLLECTION_OUTCOME"
      - name: Transfer only public results to publication job
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'run' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: method-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hiergoal-public/
          if-no-files-found: error
          retention-days: 30
      - name: Require complete audited execution when live was requested
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'run' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('runs/method-study')
          manifest = json.loads((root / 'manifest.json').read_text())
          results = json.loads((root / 'results.json').read_text())
          complete = len(results) == len(manifest['trials']) and all(
              r.get('status') in ('PASS', 'FAIL') and r.get('audit') == 'PASS'
              for r in results)
          # A scientifically negative result is a valid completed experiment.
          # Missing or unauditable evidence is an infrastructure failure.
          print('Complete audited experiment:', complete)
          raise SystemExit(0 if complete else 1)
          PY

  publish:
    needs: study
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'run' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      STUDY_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: method-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hiergoal-public
      - name: Verify identity, allowlist and checksums without executing artifact contents
        run: |
          python3 -m hiergoal.study_archive verify \
            --destination "$RUNNER_TEMP/hiergoal-public" --profile "$STUDY_PROFILE" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA"
      - name: Commit permanent results to main (no API key)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          public="$RUNNER_TEMP/hiergoal-public"
          target="experiments/method-study-live/$STUDY_PROFILE/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          for retry in 1 2 3; do
            git fetch --no-tags origin refs/heads/main
            git checkout --detach FETCH_HEAD
            if test -e "$target"; then
              diff -qr "$public" "$target"
              echo "Identical results already archived: $target" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            mkdir -p "$target"
            cp -R "$public/." "$target/"
            git add -- "$target"
            git commit -m "Archive method study $STUDY_PROFILE run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            if git push origin HEAD:refs/heads/main; then
              echo "Permanent results: $target" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo 'Permanent publication failed; inspect the public-results artifact and branch permissions.'
          exit 1
