name: Offline validation (no API keys)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Check local setup scripts (no inference)
        run: bash -n scripts/setup_opencode_free.sh scripts/smoke.sh scripts/experiment.sh scripts/install_ci_hermes.sh
      - name: No-key dry run
        run: python -m hiergoal.controller --dry-run
      - name: Paid-route dry-run without inference
        run: python -m hiergoal.controller --backend luna --dry-run

      - name: Benchmark schedule print only (no inference)
        run: python -m hiergoal.benchmark

      - name: Method comparison apparatus check (simulated, no inference)
        run: python -m hiergoal.study check --profile pilot --output runs/method-offline

      - name: Freeze heldout method study without running it
        run: python -m hiergoal.study prepare --profile study --output runs/method-prepared
