name: Offline validation (no API keys)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Check local setup scripts (no inference)
        run: bash -n scripts/setup_opencode_free.sh scripts/smoke.sh scripts/experiment.sh scripts/install_ci_hermes.sh
      - name: No-key dry run
        run: python -m hiergoal.controller --dry-run
      - name: Paid-route dry-run without inference
        run: python -m hiergoal.controller --backend luna --dry-run

      - name: Benchmark schedule print only (no inference)
        run: python -m hiergoal.benchmark

      - name: Check all five method profiles (simulated, no inference)
        run: |
          for profile in pilot study mechanism scale reliability; do
            python -m hiergoal.study check --profile "$profile" --output "runs/method-offline-$profile"
          done

      - name: Freeze heldout method study without running it
        run: python -m hiergoal.study prepare --profile study --output runs/method-prepared

      - name: Require all nine engineering criteria from replayed complementary profiles
        run: >-
          python -m hiergoal.study_suite
          --mechanism runs/method-offline-mechanism
          --scale runs/method-offline-scale
          --reliability runs/method-offline-reliability
          --output runs/method-requirements

      - name: Retain apparatus summaries and audited results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-method-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/method-offline-*/summary.*
            runs/method-offline-*/results.json
            runs/method-offline-*/host.json
            runs/method-offline-*/manifest.json
            runs/method-requirements/requirements.*
          if-no-files-found: error
          retention-days: 30
